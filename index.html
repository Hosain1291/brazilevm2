<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica UE2026 - Justiça Eleitoral (Brasil)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&family=Noto+Sans+KR:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
    }
    
    /* 실제 브라질 선거법원(TSE) Urna Eletrônica 화면 공식 산세리프 서체 */
    .font-urna-screen {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 투표기 화면 120% 스케일 적용 */
    #urnaScreen {
      --screen-scale: 1.2;
      font-size: calc(1rem * var(--screen-scale));
    }
    .scale-text-xs { font-size: calc(0.75rem * var(--screen-scale)); }
    .scale-text-sm { font-size: calc(0.875rem * var(--screen-scale)); }
    .scale-text-base { font-size: calc(1rem * var(--screen-scale)); }
    .scale-text-lg { font-size: calc(1.125rem * var(--screen-scale)); }
    .scale-text-xl { font-size: calc(1.25rem * var(--screen-scale)); }
    .scale-text-2xl { font-size: calc(1.5rem * var(--screen-scale)); }
    .scale-text-3xl { font-size: calc(1.875rem * var(--screen-scale)); }
    .scale-text-fim { font-size: calc(4.75rem * var(--screen-scale)); }
    
    @keyframes blinkCursor {
      0%, 49% { border-color: #000; }
      50%, 100% { border-color: transparent; }
    }
    .cursor-active {
      animation: blinkCursor 0.85s infinite;
    }
    
    @keyframes blinkText {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .text-blink {
      animation: blinkText 0.85s infinite;
    }

    .urna-body {
      background: linear-gradient(175deg, #f7f8fa 0%, #ebecee 50%, #dcdee3 100%);
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.35),
        0 4px 6px -2px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        inset 0 -3px 6px rgba(0, 0, 0, 0.12);
    }
    .urna-screen-bezel {
      background: #18191c;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.7);
    }
    .urna-lcd {
      background: #eef1f4;
      box-shadow: inset 1px 1px 4px rgba(0,0,0,0.18);
    }

    .key-num {
      background: linear-gradient(to bottom, #303338, #1a1b1e);
      box-shadow: 0 4px 0 #0d0e10, 0 5px 6px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
      transition: all 0.05s ease;
    }
    .key-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d0e10, 0 2px 3px rgba(0,0,0,0.3);
    }

    .key-pressed {
      transform: translateY(3px) !important;
      box-shadow: 0 1px 0 #0d0e10, 0 2px 3px rgba(0,0,0,0.3) !important;
      filter: brightness(1.2);
    }
    .key-pressed-action {
      transform: translateY(3px) !important;
      filter: brightness(1.15);
    }

    /* BRANCO (흰색 키) */
    .key-white {
      background: linear-gradient(to bottom, #ffffff, #ececec);
      box-shadow: 0 4px 0 #b3b7bd, 0 5px 6px rgba(0,0,0,0.25), inset 0 1px 1px #fff;
      color: #111;
      transition: all 0.05s ease;
    }
    .key-white:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9ca0a6, 0 2px 3px rgba(0,0,0,0.2);
    }

    /* CORRIGE (주황색 키) */
    .key-orange {
      background: linear-gradient(to bottom, #eb5e28, #cb4012);
      box-shadow: 0 4px 0 #8f2605, 0 5px 6px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.35);
      color: #fff;
      transition: all 0.05s ease;
    }
    .key-orange:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #6e1d04, 0 2px 3px rgba(0,0,0,0.3);
    }

    /* CONFIRMA (녹색 키) */
    .key-green {
      background: linear-gradient(to bottom, #43a047, #2e7d32);
      box-shadow: 0 5px 0 #1b5e20, 0 6px 8px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.35);
      color: #fff;
      transition: all 0.05s ease;
    }
    .key-green:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #124016, 0 2px 3px rgba(0,0,0,0.35);
    }

    /* 점자 돌기 및 인그레이빙 플레이트 */
    .braille-dot {
      width: 3px;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      display: inline-block;
      margin: 1px;
    }
    .braille-dot-dark {
      background-color: rgba(0, 0, 0, 0.45);
    }

    .engraved-box {
      border: 1.5px solid rgba(160, 165, 175, 0.5);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1), 0 1px 1px rgba(255,255,255,0.9);
    }
    .engraved-text {
      color: #8c939d;
      text-shadow: 1px 1px 1px rgba(255,255,255,0.8), -0.5px -0.5px 0.5px rgba(0,0,0,0.3);
    }

    .dropzone-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
      transform: scale(1.02);
      transition: all 0.15s ease;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c7c7c7; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen p-3 sm:p-6 flex flex-col items-center justify-start">

  <div class="w-full max-w-6xl flex flex-col lg:flex-row items-start justify-center gap-6 my-auto">

    <!-- 1. 브라질 전자투표기 하드웨어 본체 (UE2026) -->
    <main class="urna-body w-full max-w-[530px] rounded-[26px] p-4 sm:p-6 border border-stone-200/90 relative flex flex-col mx-auto shrink-0 select-none shadow-2xl">
      
      <!-- 상단 LED 및 공식 헤더 라인 -->
      <div class="flex justify-between items-center px-3 mb-2 opacity-65">
        <div class="w-1.5 h-1.5 rounded-full bg-stone-500 shadow-inner"></div>
        <div class="text-[9px] font-mono tracking-widest text-stone-600 font-bold uppercase">JUSTIÇA ELEITORAL - BRASIL</div>
        <div class="w-1.5 h-1.5 rounded-full bg-stone-500 shadow-inner"></div>
      </div>

      <!-- 상단 LCD 화면 영역 -->
      <div class="urna-screen-bezel p-3 rounded-xl flex flex-col mb-4">
        <div id="urnaScreen" class="urna-lcd w-full h-[320px] sm:h-[350px] rounded text-stone-900 flex flex-col justify-between p-2 sm:p-2.5 font-urna-screen relative overflow-hidden border border-stone-600/60 shadow-inner">
          
          <!-- 상단 선거 단계 탭 바 -->
          <div class="w-full flex items-center justify-between border-b border-stone-400/60 pb-1 text-[8px] sm:text-[9.5px]">
            <div id="topTabsContainer" class="flex items-center gap-1 overflow-x-auto select-none">
              <!-- JS 동적 주입 -->
            </div>
            <div id="screenTrainingBadge" class="text-[9px] sm:text-[10px] font-semibold text-stone-600 tracking-wider pl-1 uppercase shrink-0">
              TREINAMENTO
            </div>
          </div>

          <!-- 화면 메인 동적 컨텐츠 구역 -->
          <div id="screenContent" class="flex-1 flex flex-col justify-between pt-1 relative">
            <!-- JS 동적 렌더링 -->
          </div>

          <!-- 하단 공식 조작 안내 문구 -->
          <div id="screenFooterPrompt" class="text-[8px] sm:text-[9px] text-stone-800 border-t border-stone-400/80 pt-1 leading-snug">
            <!-- JS 동적 렌더링 -->
          </div>

        </div>
      </div>

      <!-- 하단: 좌측 음각 로고 + 우측 물리 키패드 -->
      <div class="flex items-end justify-between gap-3 sm:gap-4 px-1 pt-1">
        
        <!-- 좌측: 선거법원(Justiça Eleitoral) 공식 음각 & UE2026 각인 -->
        <div class="engraved-box w-36 sm:w-44 h-28 sm:h-32 rounded-lg p-2.5 flex flex-col justify-between self-end mb-1">
          <div class="flex items-center gap-2">
            <!-- 공식 선거법원 저울 엠블럼 -->
            <div class="w-8 h-8 flex items-center justify-center shrink-0">
              <svg class="w-8 h-8 text-stone-400 opacity-60" viewBox="0 0 100 100" fill="currentColor">
                <circle cx="50" cy="50" r="45" stroke="#8c939d" stroke-width="4" fill="none"/>
                <path d="M50 20 L50 80 M30 35 L70 35 M22 55 L38 55 L30 35 Z M62 55 L78 55 L70 35 Z" stroke="#8c939d" stroke-width="4" fill="none"/>
                <circle cx="50" cy="80" r="6" fill="#8c939d"/>
              </svg>
            </div>
            <div class="leading-none">
              <div class="engraved-text text-[10px] sm:text-[11px] font-bold uppercase tracking-wider">Justiça</div>
              <div class="engraved-text text-[10px] sm:text-[11px] font-bold uppercase tracking-wider">Eleitoral</div>
            </div>
          </div>
          <div class="text-center">
            <span class="engraved-text text-xl sm:text-2xl font-black font-mono tracking-widest">UE2026</span>
          </div>
        </div>

        <div class="flex-1 flex flex-col gap-2">
          <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
            
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="1">
              <span class="leading-none">1</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="2">
              <span class="leading-none">2</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="3">
              <span class="leading-none">3</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            
            <!-- BRANCO (흰색 키) -->
            <button class="key-white h-10 sm:h-12 rounded font-bold text-[9px] sm:text-[10px] uppercase flex flex-col items-center justify-center leading-tight tracking-tight" data-action="BRANCO">
              <span>BRANCO</span>
              <div class="flex gap-0.5 mt-0.5">
                <span class="braille-dot braille-dot-dark"></span>
                <span class="braille-dot braille-dot-dark"></span>
              </div>
            </button>

            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="4">
              <span class="leading-none">4</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="5">
              <span class="leading-none">5</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="6">
              <span class="leading-none">6</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>

            <!-- CORRIGE (주황색 키) -->
            <button class="key-orange h-10 sm:h-12 rounded font-bold text-[9px] sm:text-[10px] uppercase flex flex-col items-center justify-center leading-tight tracking-tight" data-action="CORRIGE">
              <span>CORRIGE</span>
              <div class="flex gap-0.5 mt-0.5">
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
              </div>
            </button>

            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="7">
              <span class="leading-none">7</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="8">
              <span class="leading-none">8</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="9">
              <span class="leading-none">9</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>

            <!-- CONFIRMA (녹색 대형 키) -->
            <button class="key-green row-span-2 rounded font-black text-xs uppercase flex flex-col items-center justify-center leading-tight tracking-wider" data-action="CONFIRMA">
              <span class="font-extrabold text-[11px] sm:text-xs">CONFIRMA</span>
              <div class="flex gap-0.5 mt-1">
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
              </div>
            </button>

            <!-- 0 키 -->
            <div class="col-start-2">
              <button class="key-num w-full h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="0">
                <span class="leading-none">0</span>
                <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
              </button>
            </div>

          </div>

        </div>

      </div>

      <!-- 하단 환기 슬롯 -->
      <div class="flex justify-between items-center px-4 pt-3 opacity-30 pointer-events-none">
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
      </div>

    </main>

    <aside class="w-full max-w-[450px] bg-white rounded-2xl shadow-xl p-5 border border-slate-200 flex flex-col gap-3.5 mx-auto">
      
      <div class="border-b border-slate-100 pb-2 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-black text-slate-800 tracking-tight">선거 관리</h2>
          <p class="text-[11px] text-slate-400">브라질 공식 총선 선거구 및 후보자 관리</p>
        </div>
        <span class="text-[11px] font-bold px-2.5 py-0.5 bg-blue-100 text-blue-700 rounded-full border border-blue-200">Justiça Eleitoral UE2026</span>
      </div>

      <!-- 투표 진행 절차 커스텀 설정 체크박스 박스 -->
      <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-slate-800">⚙️ 투표 진행 절차 설정</span>
            <span class="text-[10px] text-slate-500">(체크 시 선거 포함)</span>
          </div>
          <span id="activeStagesCountBadge" class="text-[10px] font-mono font-bold text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded border border-blue-200">5/5 활성</span>
        </div>
        <div id="stageCheckboxesContainer" class="space-y-1.5">
          <!-- JS 동적 주입 -->
        </div>
      </div>

      <!-- 현재 관리 직책 선택 드롭다운 -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">현재 관리 직책 선택</label>
          <div class="flex items-center gap-1.5">
            <input type="checkbox" id="seqVoteToggle" class="rounded text-blue-600 focus:ring-blue-500 w-3.5 h-3.5 cursor-pointer" checked />
            <label for="seqVoteToggle" id="seqVoteLabel" class="text-xs font-semibold text-slate-600 cursor-pointer select-none">연속 선거 진행</label>
          </div>
        </div>

        <div class="relative">
          <select id="roleSelector" class="w-full appearance-none bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-8 transition">
            <!-- JS 동적 주입 -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-500">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
          </div>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">등록된 후보 목록</span>
          <span id="candidateCount" class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">0명</span>
        </div>
        <div id="candidatesListContainer" class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 관리자 액션 버튼 4개 -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="btnViewResults" class="bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          투표 결과 보기
        </button>
        <button id="btnResetAllVotes" class="bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          모든 투표 초기화
        </button>
        <button id="btnExportCandidates" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          후보/결과 파일 저장
        </button>
        <button id="btnImportCandidatesTrigger" class="bg-slate-700 hover:bg-slate-800 active:scale-[0.98] text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l4-4m0 0l4 4m-4-4v12"></path></svg>
          후보/결과 파일 로드
        </button>
        <input type="file" id="candidateFileInput" accept=".json" class="hidden" />
      </div>

      <div class="border-t border-slate-100 pt-2.5">
        <div class="flex items-center justify-between mb-1.5">

  <!-- 알림 토스트 박스 -->

    <span id="toastMsg">알림 메시지</span>
  </div>

  <script>
    const BRAZIL_ROLES = {
      dep_fed: {
        id: 'dep_fed',
        name: 'Deputado Federal',
        shortTab: 'Dep. Federal',
        digits: 4,
        hasVice: false,
        poolKey: 'dep_fed'
      },
      dep_est: {
        id: 'dep_est',
        name: 'Deputado Estadual',
        shortTab: 'Dep. Estadual',
        digits: 5,
        hasVice: false,
        poolKey: 'dep_est'
      },
      sen_1: {
        id: 'sen_1',
        name: 'Senador - 1ª vaga',
        shortTab: 'Senador - 1ª vaga',
        digits: 3,
        hasVice: false,
        poolKey: 'senador'
      },
      sen_2: {
        id: 'sen_2',
        name: 'Senador - 2ª vaga',
        shortTab: 'Senador - 2ª vaga',
        digits: 3,
        hasVice: false,
        poolKey: 'senador'
      },
      governador: {
        id: 'governador',
        name: 'Governador',
        shortTab: 'Governador',
        digits: 2,
        hasVice: true,
        viceLabel: 'Vice-Governador',
        poolKey: 'governador'
      },
      presidente: {
        id: 'presidente',
        name: 'Presidente da República',
        shortTab: 'Presidente',
        digits: 2,
        hasVice: true,
        viceLabel: 'Vice-Presidente',
        poolKey: 'presidente'
      }
    };

    const BRAZIL_SEQUENCE = ['dep_fed', 'dep_est', 'sen_1', 'sen_2', 'governador', 'presidente'];

    // 사용자가 체크박스로 활성화/비활성화 가능한 단계 상태
    let enabledRoles = {
      dep_fed: true,
      dep_est: true,
      sen_1: true,
      sen_2: true,
      governador: true,
      presidente: true
    };

    function getActiveSequence() {
      const active = BRAZIL_SEQUENCE.filter(key => enabledRoles[key]);
      return active.length > 0 ? active : [BRAZIL_SEQUENCE[0]];
    }

    // 기본 브라질 공식 후보 데이터 (상원의원은 1차·2차 공통 풀 'senador' 사용)
    let CANDIDATES_DB = {
      dep_fed: {
        '1301': { name: 'Geraldo Alckmin', party: 'PSB', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80' },
        '2222': { name: 'Eduardo Bolsonaro', party: 'PL', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80' }
      },
      dep_est: {
        '92001': { name: 'Frevo', party: 'PMus', avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80' },
        '13555': { name: 'Marina Silva', party: 'REDE', avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=300&q=80' }
      },
      senador: {
        '131': { name: 'Camilo Santana', party: 'PT', avatar: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=300&q=80' },
        '222': { name: 'Marcos Pontes', party: 'PL', avatar: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=300&q=80' },
        '456': { name: 'Mara Gabrilli', party: 'PSDB', avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80' }
      },
      governador: {
        '13': { name: 'Fernando Haddad', party: 'PT', vice: 'Lúcia França', avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=80' },
        '10': { name: 'Tarcísio de Freitas', party: 'Republicanos', vice: 'Felicio Ramuth', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80' }
      },
      presidente: {
        '13': { name: 'Luiz Inácio Lula da Silva', party: 'PT', vice: 'Geraldo Alckmin', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80', viceAvatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80' },
        '22': { name: 'Jair Bolsonaro', party: 'PL', vice: 'Braga Netto', avatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80', viceAvatar: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=300&q=80' }
      }
    };

    function getCandidatesMapForRole(roleKey) {
      const poolKey = BRAZIL_ROLES[roleKey]?.poolKey || roleKey;
      if (!CANDIDATES_DB[poolKey]) {
        CANDIDATES_DB[poolKey] = {};
      }
      return CANDIDATES_DB[poolKey];
    }

    let ELECTION_RESULTS = {};
    function initResults() {
      ELECTION_RESULTS = {};
      BRAZIL_SEQUENCE.forEach(r => {
        ELECTION_RESULTS[r] = { votes: {}, branco: 0, nulo: 0, total: 0 };
      });
    }
    initResults();

    let currentRoleKey = BRAZIL_SEQUENCE[0];
    let typedNumber = '';
    let isWhiteVote = false;
    let isFinished = false;
    let currentPhotoRatio = '3:4';
    let currentUploadedCandPhoto = '';
    let currentUploadedVicePhoto = '';
    let firstSenatorVoteNumber = null; // 상원의원 1차 투표 번호 기록 (동일 후보 2차 투표 무효화 체크용)
    // 단계별 확인음 (940Hz 사각파)
    function playStepConfirmTone() {
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(940, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      } catch (e) {}
    }

    // 최종 투표 완료음 (TSE 브라질 공식 시그니처 롱톤)
    function playFimTone() {
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const beeps = [0, 0.075, 0.15, 0.225, 0.30];
        beeps.forEach(t => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1150, now + t);
          gain.gain.setValueAtTime(0.2, now + t);
          gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.045);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + t);
          osc.stop(now + t + 0.048);
        });

        const longStartTime = now + 0.39;
        const oscLong = audioCtx.createOscillator();
        const oscLongSub = audioCtx.createOscillator();
        const gainLong = audioCtx.createGain();

        oscLong.type = 'square';
        oscLong.frequency.setValueAtTime(840, longStartTime);
        oscLongSub.type = 'sine';
        oscLongSub.frequency.setValueAtTime(1680, longStartTime);

        gainLong.gain.setValueAtTime(0.25, longStartTime);
        gainLong.gain.setValueAtTime(0.25, longStartTime + 1.25);
        gainLong.gain.linearRampToValueAtTime(0.001, longStartTime + 1.45);

        oscLong.connect(gainLong);
        oscLongSub.connect(gainLong);
        gainLong.connect(audioCtx.destination);

        oscLong.start(longStartTime);
        oscLongSub.start(longStartTime);
        oscLong.stop(longStartTime + 1.46);
        oscLongSub.stop(longStartTime + 1.46);
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      const text = document.getElementById('toastMsg');
      text.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    function renderStageCheckboxes() {
      const container = document.getElementById('stageCheckboxesContainer');
      const activeList = getActiveSequence();
      document.getElementById('activeStagesCountBadge').textContent = `${activeList.length}/${BRAZIL_SEQUENCE.length} 활성`;
      document.getElementById('seqVoteLabel').textContent = `${activeList.length}단계 연속 선거 진행`;

      container.innerHTML = BRAZIL_SEQUENCE.map((rKey, idx) => {
        const isChecked = !!enabledRoles[rKey];
        const rObj = BRAZIL_ROLES[rKey];

        return `
          <label class="flex items-center justify-between px-2.5 py-1.5 bg-white hover:bg-slate-100 rounded-lg border ${isChecked ? 'border-slate-300 shadow-xs' : 'border-dashed border-slate-200 opacity-60'} cursor-pointer select-none text-[11px] transition">
            <div class="flex items-center gap-2 truncate">
              <input type="checkbox" class="stage-toggle rounded text-blue-600 focus:ring-blue-500 w-3.5 h-3.5 cursor-pointer" data-role="${rKey}" ${isChecked ? 'checked' : ''} />
              <span class="font-medium text-slate-800 truncate">${idx + 1}. ${rObj.name}</span>
            </div>
            <span class="text-[9.5px] font-mono px-1.5 py-0.2 rounded font-bold ${isChecked ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-400'}">${rObj.digits}자리</span>
          </label>
        `;
      }).join('');

      container.querySelectorAll('.stage-toggle').forEach(input => {
        input.addEventListener('change', (e) => {
          const rKey = e.target.getAttribute('data-role');
          const isNowChecked = e.target.checked;
          
          if (!isNowChecked) {
            const willRemaining = BRAZIL_SEQUENCE.filter(k => (k === rKey ? false : enabledRoles[k]));
            if (willRemaining.length === 0) {
              e.target.checked = true;
              showToast('최소 한 개의 선거 단계는 선택되어 있어야 합니다.');
              return;
            }
          }

          enabledRoles[rKey] = isNowChecked;
          const activeSeq = getActiveSequence();

          if (!enabledRoles[currentRoleKey]) {
            currentRoleKey = activeSeq[0];
          }

          renderStageCheckboxes();
          updateRoleDropdown();
          syncRoleUi();
          renderCandidateList();
          renderScreen();

          const rObj = BRAZIL_ROLES[rKey];
          showToast(`선거 단계 [${rObj.name}] ${isNowChecked ? '포함됨' : '제외됨'}`);
        });
      });
    }

    function renderScreen() {
      const screen = document.getElementById('screenContent');
      const footerPrompt = document.getElementById('screenFooterPrompt');
      const tabsContainer = document.getElementById('topTabsContainer');
      const role = BRAZIL_ROLES[currentRoleKey];
      const activeSequence = getActiveSequence();

      // 상단 탭 렌더링 (활성화된 단계만 표시)
      tabsContainer.innerHTML = activeSequence.map(k => {
        const isActive = (k === currentRoleKey);
        const rObj = BRAZIL_ROLES[k];

        return `
          <button type="button" class="tab-btn px-1.5 sm:px-2 py-0.5 text-[7.5px] sm:text-[9px] font-urna-screen tracking-tight transition cursor-pointer select-none border-b-2 ${isActive ? 'bg-[#18191c] text-white font-bold border-amber-400 shadow-sm' : 'bg-[#bfc3cb] hover:bg-[#a8adb7] text-[#33373e] font-medium border-transparent'}" data-role="${k}">
            ${rObj.shortTab}
          </button>
        `;
      }).join('');

      tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          switchRole(btn.getAttribute('data-role'));
        });
      });

      // 1. 투표 완료 화면 (FIM / VOTOU)
      if (isFinished) {
        footerPrompt.style.display = 'none';
        screen.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center relative">
            <h1 class="scale-text-fim font-black tracking-normal text-stone-950 font-urna-screen leading-none">FIM</h1>
            <div class="absolute bottom-2 right-2 scale-text-sm font-semibold tracking-wider text-stone-700 uppercase font-urna-screen">
              VOTOU
            </div>
          </div>
        `;
        return;
      }

      footerPrompt.style.display = 'block';
      footerPrompt.innerHTML = `
        <div class="font-normal text-stone-800">Aperte a tecla:</div>
        <div class="pl-2">
          <div><strong class="font-bold text-stone-900">CONFIRMA</strong> para CONFIRMAR este voto</div>
          <div><strong class="font-bold text-stone-900">CORRIGE</strong> para REINICIAR este voto</div>
        </div>
      `;

      const roleDisplayName = role.name;
      const viceLabel = role.viceLabel || 'Vice';

      // 2. 백지 투표 (VOTO EM BRANCO)
      if (isWhiteVote) {
        screen.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-1.5 font-urna-screen">
            <div>
              <div class="scale-text-xs uppercase tracking-normal text-stone-700 font-normal">SEU VOTO PARA</div>
              <h2 class="scale-text-xl font-bold text-stone-900 tracking-tight leading-tight mt-0.5">${roleDisplayName}</h2>
            </div>
            
            <div class="py-5 text-center">
              <div class="scale-text-3xl font-black text-stone-950 tracking-wide text-blink">
                VOTO EM BRANCO
              </div>
            </div>

            <div class="text-center py-1">
              <span class="scale-text-base font-bold text-stone-900 text-blink">CONFIRA O SEU VOTO</span>
            </div>
          </div>
        `;
        return;
      }

      const candidates = getCandidatesMapForRole(currentRoleKey);
      const candidate = candidates[typedNumber] || null;
      const isCompleteNumber = typedNumber.length === role.digits;
      const isDuplicateSenateVote = (currentRoleKey === 'sen_2' && typedNumber === firstSenatorVoteNumber && firstSenatorVoteNumber !== null);
      const isNullVote = isCompleteNumber && (!candidate || isDuplicateSenateVote);

      let boxesHtml = '';
      for (let i = 0; i < role.digits; i++) {
        const char = typedNumber[i] || '';
        const isCurrent = (i === typedNumber.length);
        const activeClass = isCurrent ? 'border-[1.8px] border-stone-950 cursor-active' : 'border border-stone-500';
        boxesHtml += `
          <div class="w-6 h-8 sm:w-7 sm:h-9 bg-white/90 flex items-center justify-center scale-text-2xl font-bold text-stone-950 font-urna-screen ${activeClass}">
            ${char}
          </div>
        `;
      }

      const aspectClass = (currentPhotoRatio === '4:5') ? 'aspect-[4/5] w-[84px] sm:w-[96px]' : 'aspect-[3/4] w-[80px] sm:w-[92px]';

      let photoSectionHtml = '';
      if (candidate && !isDuplicateSenateVote) {
        photoSectionHtml = `
          <div class="flex flex-col items-center">
            <div class="${aspectClass} bg-stone-200 border-[1.5px] border-stone-800 rounded-xs overflow-hidden shadow-xs relative">
              ${candidate.avatar ? `<img src="${candidate.avatar}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/120x150/dbe2d8/333333?text=Foto';" />` : `<div class="w-full h-full flex items-center justify-center text-3xl">👤</div>`}
            </div>

            ${role.hasVice && candidate.vice ? `
              <div class="w-14 aspect-[3/4] bg-stone-200 border border-stone-700 rounded-xs overflow-hidden shadow-xs relative mt-1">
                ${candidate.viceAvatar ? `<img src="${candidate.viceAvatar}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/100x133/dbe2d8/333333?text=Vice';" />` : `<div class="w-full h-full flex items-center justify-center text-sm">👥</div>`}
                <span class="absolute bottom-0 inset-x-0 bg-stone-900/85 text-[6.5px] text-white text-center py-0.5 font-bold uppercase font-urna-screen">${viceLabel}</span>
              </div>
            ` : ''}
          </div>
        `;
      } else {
        photoSectionHtml = `
          <div class="${aspectClass} bg-stone-200/50 border border-stone-400 rounded-xs flex flex-col items-center justify-center text-stone-400 text-xs">
            <span class="text-2xl opacity-40">👤</span>
          </div>

    function updateRoleDropdown() {
      const select = document.getElementById('roleSelector');

    function syncRoleUi() {
      const role = BRAZIL_ROLES[currentRoleKey];
      document.getElementById('viceContainer').style.display = role.hasVice ? 'flex' : 'none';
      const candNumInput = document.getElementById('newCandNumber');
      candNumInput.maxLength = role.digits;
      candNumInput.placeholder = `${role.digits}자리 번호`;

    function switchRole(roleKey) {
      if (!BRAZIL_ROLES[roleKey] || !enabledRoles[roleKey]) return;
      currentRoleKey = roleKey;
      isFinished = false;
      typedNumber = '';
      isWhiteVote = false;

      document.getElementById('roleSelector').value = roleKey;
      syncRoleUi();
      renderCandidateList();
      renderScreen();
      
      const rObj = BRAZIL_ROLES[roleKey];
      showToast(`${rObj.name} 투표 단계로 전환되었습니다.`);
    }

    function handleDigit(numStr) {
      if (isFinished || isWhiteVote) return;
      const role = BRAZIL_ROLES[currentRoleKey];
      if (typedNumber.length < role.digits) {
        typedNumber += numStr;
        playKeyTone();
        renderScreen();
      }
    }

    function handleWhite() {
      if (isFinished) return;
      if (typedNumber === '') {
        isWhiteVote = true;
        playKeyTone();
        renderScreen();
      }
    }

    function handleCorrige() {
      if (isFinished) return;
      playKeyTone();
      typedNumber = '';
      isWhiteVote = false;
      renderScreen();
    }

    function handleConfirma() {
      if (isFinished) {
        resetVoteScreen();
        return;
      }

      const role = BRAZIL_ROLES[currentRoleKey];
      const isCompleteNumber = typedNumber.length === role.digits;

      if (isWhiteVote || isCompleteNumber) {
        const currentElection = ELECTION_RESULTS[currentRoleKey];
        currentElection.total++;

        if (isWhiteVote) {
          currentElection.branco++;
          if (currentRoleKey === 'sen_1') {
            firstSenatorVoteNumber = '__BRANCO__';
          }
        } else {
          const candidates = getCandidatesMapForRole(currentRoleKey);
          const cand = candidates[typedNumber];
          
          // 브라질 선거법 규칙: 1차 상원의원 투표와 2차 상원의원 투표에서 동일 후보 선택 시 2차 투표는 무효(NULO) 처리
          const isDuplicateSenate = (currentRoleKey === 'sen_2' && typedNumber === firstSenatorVoteNumber && firstSenatorVoteNumber !== null);

          if (cand && !isDuplicateSenate) {
            currentElection.votes[typedNumber] = (currentElection.votes[typedNumber] || 0) + 1;
          } else {
            currentElection.nulo++;
          }

          if (currentRoleKey === 'sen_1') {
            firstSenatorVoteNumber = typedNumber;
          }
        }

        const isSequential = document.getElementById('seqVoteToggle').checked;
        const activeSequence = getActiveSequence();
        const currentIdx = activeSequence.indexOf(currentRoleKey);
        const hasNext = isSequential && currentIdx >= 0 && currentIdx < activeSequence.length - 1;

        if (hasNext) {
          playStepConfirmTone();
          const nextRole = activeSequence[currentIdx + 1];
          currentRoleKey = nextRole;
          typedNumber = '';
          isWhiteVote = false;

          document.getElementById('roleSelector').value = nextRole;
          syncRoleUi();
          renderCandidateList();
          renderScreen();

          const nextObj = BRAZIL_ROLES[nextRole];
          showToast(`다음 투표: ${nextObj.name}`);
        } else {
          isFinished = true;
          renderScreen();
          playFimTone();

          setTimeout(() => {
            const firstActive = getActiveSequence()[0];
            currentRoleKey = firstActive;
            firstSenatorVoteNumber = null;
            document.getElementById('roleSelector').value = currentRoleKey;
            resetVoteScreen();
          }, 3600);
        }
      } else {
        playKeyTone();
      }
    }

    function setupDropZone(dropZoneId, fileInputId, urlInputId, isVice = false) {
      const dropZone = document.getElementById(dropZoneId);
      const fileInput = document.getElementById(fileInputId);
      const urlInput = document.getElementById(urlInputId);

      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('dropzone-active');
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('dropzone-active');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files && dt.files.length > 0) {
          const file = dt.files[0];
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => applyCandidateImage(event.target.result, isVice);
            reader.readAsDataURL(file);
            return;
          }
        }

        const droppedText = dt.getData('text/uri-list') || dt.getData('text/plain') || dt.getData('text/html');
        if (droppedText) {
          let foundUrl = '';
          const urlMatch = droppedText.match(/https?:\/\/[^\s"'<>]+/i);
          if (urlMatch) {
            foundUrl = urlMatch[0];
          } else if (droppedText.startsWith('http')) {
            foundUrl = droppedText.trim();
          }

          if (foundUrl) {
            urlInput.value = foundUrl;
            applyCandidateImage(foundUrl, isVice);
            return;
          }
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => applyCandidateImage(event.target.result, isVice);
          reader.readAsDataURL(file);
        }
      });

      urlInput.addEventListener('input', (e) => {
        const url = e.target.value.trim();
        if (url) {
          applyCandidateImage(url, isVice);
        }
      });
    }

      btn.addEventListener('click', () => {
        const action = btn.getAttribute('data-action');
        if (action === 'BRANCO') handleWhite();
        else if (action === 'CORRIGE') handleCorrige();
        else if (action === 'CONFIRMA') handleConfirma();
      });
    });

    function animateButtonPress(selector, isAction = false) {
      const btn = document.querySelector(selector);
      if (!btn) return;
      const activeClass = isAction ? 'key-pressed-action' : 'key-pressed';
      btn.classList.add(activeClass);
      setTimeout(() => {
        btn.classList.remove(activeClass);
      }, 110);
    }

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if ((e.key >= '0' && e.key <= '9') || (e.code && e.code.startsWith('Numpad') && !isNaN(e.key))) {
        e.preventDefault();
        const digit = e.key;
        animateButtonPress(`[data-key="${digit}"]`);
        handleDigit(digit);
        return;
      }

      if (e.key === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        animateButtonPress('[data-action="CONFIRMA"]', true);
        handleConfirma();
        return;
      }

      if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        animateButtonPress('[data-action="CORRIGE"]', true);
        handleCorrige();
        return;
      }

      if (e.key === 'b' || e.key === 'B' || e.code === 'Space') {
        e.preventDefault();
        animateButtonPress('[data-action="BRANCO"]', true);
        handleWhite();
        return;
      }
    });

    // 초기 실행
    renderStageCheckboxes();
    updateRoleDropdown();
    syncRoleUi();
    renderCandidateList();
    renderScreen();
  </script>
</body>
</html>
