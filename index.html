<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna Eletrônica UE2026 - 브라질 전자투표기 & 선거 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
    }
    
    /* 실제 브라질 선거법원(TSE) Urna Eletrônica 화면 공식 산세리프 서체 */
    .font-urna-screen {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* 투표기 화면 동적 폰트 스케일링 변수 (기본값: 120%) */
    #urnaScreen {
      --screen-scale: 1.2;
      font-size: calc(1rem * var(--screen-scale));
    }
    .scale-text-xs { font-size: calc(0.75rem * var(--screen-scale)); }
    .scale-text-sm { font-size: calc(0.875rem * var(--screen-scale)); }
    .scale-text-base { font-size: calc(1rem * var(--screen-scale)); }
    .scale-text-lg { font-size: calc(1.125rem * var(--screen-scale)); }
    .scale-text-xl { font-size: calc(1.25rem * var(--screen-scale)); }
    .scale-text-2xl { font-size: calc(1.5rem * var(--screen-scale)); }
    .scale-text-3xl { font-size: calc(1.875rem * var(--screen-scale)); }
    .scale-text-fim { font-size: calc(4.75rem * var(--screen-scale)); }
    
    /* 실제 우르나 LCD 커서 및 텍스트 점멸 */
    @keyframes blinkCursor {
      0%, 49% { border-color: #000; }
      50%, 100% { border-color: transparent; }
    }
    .cursor-active {
      animation: blinkCursor 0.85s infinite;
    }
    
    @keyframes blinkText {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .text-blink {
      animation: blinkText 0.85s infinite;
    }

    /* UE2026 실물 바디 질감 */
    .urna-body {
      background: linear-gradient(175deg, #f7f8fa 0%, #ebecee 50%, #dcdee3 100%);
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.35),
        0 4px 6px -2px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        inset 0 -3px 6px rgba(0, 0, 0, 0.12);
    }
    .urna-screen-bezel {
      background: #18191c;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 1px 2px rgba(255,255,255,0.7);
    }
    .urna-lcd {
      background: #eef1f4;
      box-shadow: inset 1px 1px 4px rgba(0,0,0,0.18);
    }

    /* 상단 공식 단계 탭 네비게이션 스타일 */
    .step-tab {
      background: #b8bdc5;
      color: #3e4450;
      clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 100%, 7px 100%);
    }
    .step-tab.active {
      background: #252830;
      color: #ffffff;
      font-weight: 700;
    }

    /* 실제 우르나 번호 박스 */
    .urna-num-box {
      border: 1.5px solid #202226;
      background: rgba(255, 255, 255, 0.7);
    }

    /* 하드웨어 물리 키패드 */
    .key-num {
      background: linear-gradient(to bottom, #303338, #1a1b1e);
      box-shadow: 0 4px 0 #0d0e10, 0 5px 6px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
      transition: all 0.05s ease;
    }
    .key-num:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d0e10, 0 2px 3px rgba(0,0,0,0.3);
    }

    /* 키보드 타건 시 시각적 반응 클래스 */
    .key-pressed {
      transform: translateY(3px) !important;
      box-shadow: 0 1px 0 #0d0e10, 0 2px 3px rgba(0,0,0,0.3) !important;
      filter: brightness(1.2);
    }
    .key-pressed-action {
      transform: translateY(3px) !important;
      filter: brightness(1.15);
    }

    .key-white {
      background: linear-gradient(to bottom, #ffffff, #ececec);
      box-shadow: 0 4px 0 #b3b7bd, 0 5px 6px rgba(0,0,0,0.25), inset 0 1px 1px #fff;
      color: #111;
      transition: all 0.05s ease;
    }
    .key-white:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9ca0a6, 0 2px 3px rgba(0,0,0,0.2);
    }

    .key-orange {
      background: linear-gradient(to bottom, #eb5e28, #cb4012);
      box-shadow: 0 4px 0 #8f2605, 0 5px 6px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.35);
      color: #fff;
      transition: all 0.05s ease;
    }
    .key-orange:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #6e1d04, 0 2px 3px rgba(0,0,0,0.3);
    }

    .key-green {
      background: linear-gradient(to bottom, #43a047, #2e7d32);
      box-shadow: 0 5px 0 #1b5e20, 0 6px 8px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.35);
      color: #fff;
      transition: all 0.05s ease;
    }
    .key-green:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #124016, 0 2px 3px rgba(0,0,0,0.35);
    }

    /* 드래그 앤 드롭 활성화 스타일 */
    .dropzone-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
      transform: scale(1.02);
      transition: all 0.15s ease;
    }

    .braille-dot {
      width: 3px;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      display: inline-block;
      margin: 1px;
    }
    .braille-dot-dark {
      background-color: rgba(0, 0, 0, 0.45);
    }

    .engraved-box {
      border: 1.5px solid rgba(160, 165, 175, 0.5);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1), 0 1px 1px rgba(255,255,255,0.9);
    }
    .engraved-text {
      color: #8c939d;
      text-shadow: 1px 1px 1px rgba(255,255,255,0.8), -0.5px -0.5px 0.5px rgba(0,0,0,0.3);
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #c7c7c7;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen p-2 sm:p-6 flex flex-col items-center justify-center">

  <div class="w-full max-w-6xl flex flex-col lg:flex-row items-start justify-center gap-6">

    <!-- 1. 브라질 전자투표기 UE2026 하드웨어 본체 -->
    <main class="urna-body w-full max-w-[530px] rounded-[26px] p-4 sm:p-6 border border-stone-200/90 relative flex flex-col mx-auto shrink-0 select-none shadow-2xl">
      
      <!-- 상단 LED 및 상판 로고 디테일 -->
      <div class="flex justify-between items-center px-3 mb-2 opacity-65">
        <div class="w-1.5 h-1.5 rounded-full bg-stone-500 shadow-inner"></div>
        <div class="text-[9px] font-mono tracking-widest text-stone-600 font-bold uppercase">JUSTIÇA ELEITORAL - BRASIL</div>
        <div class="w-1.5 h-1.5 rounded-full bg-stone-500 shadow-inner"></div>
      </div>

      <!-- 상단 LCD 화면 영역 -->
      <div class="urna-screen-bezel p-3 rounded-xl flex flex-col mb-4">
        <div id="urnaScreen" class="urna-lcd w-full h-[320px] sm:h-[350px] rounded text-stone-900 flex flex-col justify-between p-2 sm:p-2.5 font-urna-screen relative overflow-hidden border border-stone-600/60 shadow-inner">
          
          <!-- 상단 공식 선거 단계 탭 바 (실제 UE2022/UE2026 인터페이스 구현) -->
          <div class="w-full flex items-center justify-between border-b border-stone-400/60 pb-1 text-[8px] sm:text-[9.5px]">
            <div id="topTabsContainer" class="flex items-center gap-1 overflow-x-auto select-none">
              <!-- JS 동적 탭 렌더링 -->
            </div>
            <div class="text-[9px] sm:text-[10px] font-semibold text-stone-600 tracking-wider pl-1 uppercase shrink-0">
              TREINAMENTO
            </div>
          </div>

          <!-- 화면 메인 동적 컨텐츠 구역 -->
          <div id="screenContent" class="flex-1 flex flex-col justify-between pt-1 relative">
            <!-- JS 동적 렌더링 -->
          </div>

          <!-- 하단 공식 조작 안내 문구 (사진 속 Aperte a tecla 완벽 반영) -->
          <div id="screenFooterPrompt" class="text-[8px] sm:text-[9px] text-stone-800 border-t border-stone-400/80 pt-1 leading-snug">
            <div class="font-normal text-stone-800">Aperte a tecla:</div>
            <div class="pl-2">
              <div><strong class="font-bold text-stone-900">CONFIRMA</strong> para CONFIRMAR este voto</div>
              <div><strong class="font-bold text-stone-900">CORRIGE</strong> para REINICIAR este voto</div>
            </div>
          </div>

        </div>
      </div>

      <!-- 하단: 좌측 UE2026 음각 로고 + 우측 물리 키패드 -->
      <div class="flex items-end justify-between gap-3 sm:gap-4 px-1 pt-1">
        
        <!-- 좌측: Justiça Eleitoral 공식 음각 및 UE2026 각인 -->
        <div class="engraved-box w-36 sm:w-44 h-28 sm:h-32 rounded-lg p-2 flex flex-col justify-between self-end mb-1">
          <div class="flex items-center gap-2">
            <svg class="w-7 h-7 sm:w-8 sm:h-8 text-stone-400 opacity-60" viewBox="0 0 100 100" fill="currentColor">
              <circle cx="50" cy="50" r="45" stroke="#8c939d" stroke-width="8" fill="none"/>
              <path d="M25 50 Q 50 20, 75 50 T 25 50" fill="#8c939d"/>
              <circle cx="50" cy="50" r="14" fill="#6c737d"/>
            </svg>
            <div class="leading-none">
              <div class="engraved-text text-[11px] sm:text-xs font-bold uppercase tracking-wider">Justiça</div>
              <div class="engraved-text text-[11px] sm:text-xs font-bold uppercase tracking-wider">Eleitoral</div>
            </div>
          </div>
          <div class="text-center">
            <span class="engraved-text text-xl sm:text-2xl font-black font-mono tracking-widest">UE2026</span>
          </div>
        </div>

        <!-- 우측: 숫자 및 3색 기능키 키패드 -->
        <div class="flex-1 flex flex-col gap-2">
          <div class="grid grid-cols-4 gap-1.5 sm:gap-2">
            
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="1">
              <span class="leading-none">1</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="2">
              <span class="leading-none">2</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="3">
              <span class="leading-none">3</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            
            <!-- BRANCO (흰색 키) -->
            <button class="key-white h-10 sm:h-12 rounded font-bold text-[9px] sm:text-[10px] uppercase flex flex-col items-center justify-center leading-tight" data-action="BRANCO">
              <span>BRANCO</span>
              <div class="flex gap-0.5 mt-0.5">
                <span class="braille-dot braille-dot-dark"></span>
                <span class="braille-dot braille-dot-dark"></span>
              </div>
            </button>

            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="4">
              <span class="leading-none">4</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="5">
              <span class="leading-none">5</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="6">
              <span class="leading-none">6</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>

            <!-- CORRIGE (주황색 키) -->
            <button class="key-orange h-10 sm:h-12 rounded font-bold text-[9px] sm:text-[10px] uppercase flex flex-col items-center justify-center leading-tight" data-action="CORRIGE">
              <span>CORRIGE</span>
              <div class="flex gap-0.5 mt-0.5">
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
              </div>
            </button>

            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="7">
              <span class="leading-none">7</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="8">
              <span class="leading-none">8</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
            </button>
            <button class="key-num h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="9">
              <span class="leading-none">9</span>
              <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span></div>
            </button>

            <!-- CONFIRMA (녹색 대형 키) -->
            <button class="key-green row-span-2 rounded font-black text-xs uppercase flex flex-col items-center justify-center leading-tight tracking-wider" data-action="CONFIRMA">
              <span class="font-extrabold text-[11px] sm:text-xs">CONFIRMA</span>
              <div class="flex gap-0.5 mt-1">
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
                <span class="braille-dot"></span>
              </div>
            </button>

            <!-- 0 키 -->
            <div class="col-start-2">
              <button class="key-num w-full h-10 sm:h-12 rounded text-white font-mono text-xl font-bold flex flex-col items-center justify-center" data-key="0">
                <span class="leading-none">0</span>
                <div class="flex gap-0.5 mt-0.5"><span class="braille-dot"></span><span class="braille-dot"></span></div>
              </button>
            </div>

          </div>

        </div>

      </div>

      <!-- 기기 하단 환기 슬롯 -->
      <div class="flex justify-between items-center px-4 pt-3 opacity-30 pointer-events-none">
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
        <span class="w-1.5 h-1 bg-stone-700 rounded-sm"></span>
      </div>

    </main>

    <!-- 2. 선거 관리 패널 (사용자가 전달한 이미지 형태 1:1 완벽 구현) -->
    <aside class="w-full max-w-[440px] bg-white rounded-2xl shadow-xl p-5 sm:p-6 border border-slate-200 flex flex-col gap-4 mx-auto">
      
      <div class="border-b border-slate-100 pb-2">
        <h2 class="text-2xl font-black text-slate-800 tracking-tight">선거 관리</h2>
        <p class="text-xs text-slate-400 mt-0.5">후보 커스텀, 사진 비율 설정 및 실시간 집계</p>
      </div>

      <!-- 선거 유형 선택 드롭다운 -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-sm font-semibold text-slate-700">선거 유형 선택</label>
          <div class="flex items-center gap-1.5">
            <input type="checkbox" id="seqVoteToggle" class="rounded text-blue-600 focus:ring-blue-500 w-3.5 h-3.5 cursor-pointer" checked />
            <label for="seqVoteToggle" class="text-xs font-semibold text-slate-600 cursor-pointer select-none">연속 선거 진행</label>
          </div>
        </div>
        <div class="relative">
          <select id="roleSelector" class="w-full appearance-none bg-white border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-8 transition">
            <option value="dep_fed">1. 연방하원의원 선거 (Deputado Federal - 4자리)</option>
            <option value="dep_est">2. 주하원의원 선거 (Deputado Estadual - 5자리)</option>
            <option value="senador">3. 상원의원 선거 (Senador - 3자리)</option>
            <option value="governador">4. 주지사 선거 (Governador - 2자리)</option>
            <option value="presidente">5. 대통령 선거 (Presidente - 2자리)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-500">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
          </div>
        </div>
      </div>

      <!-- 현재 등록된 후보 목록 -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">등록된 후보 목록</span>
          <span id="candidateCount" class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">0명</span>
        </div>
        <div id="candidatesListContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- JS 렌더링 -->
        </div>
      </div>

      <!-- 관리자 액션 버튼 4개 (이미지 속 2x2 그리드 색상 완벽 구현) -->
      <div class="grid grid-cols-2 gap-2.5 pt-1">
        <button id="btnViewResults" class="bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-lg text-sm shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
          투표 결과 보기
        </button>
        <button id="btnResetAllVotes" class="bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-lg text-sm shadow transition flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          모든 투표 초기화
        </button>
        <button id="btnExportCandidates" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-2.5 px-3 rounded-lg text-sm shadow transition flex items-center justify-center gap-1.5">

  <script>
    /* 1. 선거 직책(Roles) 데이터 */
    const ROLES = {
      dep_fed: {
        id: 'dep_fed',
        name: 'Deputado Federal',
        shortTab: 'Dep. Federal',
        krName: '연방하원의원 (4자리)',
        digits: 4,
        hasVice: false
      },
      dep_est: {
        id: 'dep_est',
        name: 'Deputado Estadual',
        shortTab: 'Dep. Estadual',
        krName: '주하원의원 (5자리)',
        digits: 5,
        hasVice: false
      },
      senador: {
        id: 'senador',
        name: 'Senador',
        shortTab: 'Senador',
        krName: '상원의원 (3자리)',
        digits: 3,
        hasVice: true,
        viceLabel: '1º Suplente'
      },
      governador: {
        id: 'governador',
        name: 'Governador',
        shortTab: 'Governador',
        krName: '주지사 (2자리)',
        digits: 2,
        hasVice: true,
        viceLabel: 'Vice-Governador'
      },
      presidente: {
        id: 'presidente',
        name: 'Presidente',
        shortTab: 'Presidente',
        krName: '대통령 (2자리)',
        digits: 2,
        hasVice: true,
        viceLabel: 'Vice-Presidente'
      }
    };

    /* 2. 초기 후보자 데이터베이스 (브라질 현실 후보 및 사진 속 샘플 후보) */
    let CANDIDATES_DB = {
      dep_fed: {
        '2222': { name: 'Eduardo Bolsonaro', party: 'PL', avatar: 'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=300&q=80' },
        '5050': { name: 'Guilherme Boulos', party: 'PSOL', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80' }
      },
      dep_est: {
        '92001': { name: 'Frevo', party: 'PMus', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80' },
        '91001': { name: 'Golfe', party: 'PEsp', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=300&q=80' }
      },
      senador: {
        '222': { name: 'Marcos Pontes', party: 'PL', vice: 'Alberto Astronauta', avatar: 'https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=300&q=80' },
        '400': { name: 'Márcio França', party: 'PSB', vice: 'Augusto Vice', avatar: 'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=300&q=80' }
      },
      governador: {
        '10': { name: 'Tarcísio de Freitas', party: 'Republicanos', vice: 'Felicio Ramuth', avatar: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=300&q=80' },
        '13': { name: 'Fernando Haddad', party: 'PT', vice: 'Lúcia França', avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=80' }
      },
      presidente: {
        '13': { name: 'Luiz Inácio Lula da Silva', party: 'PT', vice: 'Geraldo Alckmin', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80', viceAvatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80' },
        '22': { name: 'Jair Bolsonaro', party: 'PL', vice: 'Walter Braga Netto', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80', viceAvatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=300&q=80' },
        '15': { name: 'Simone Tebet', party: 'MDB', vice: 'Mara Gabrilli', avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80', viceAvatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=300&q=80' }
      }
    };

    /* 3. 누적 투표 기록 (Boletim de Urna) */
    let ELECTION_RESULTS = {
      dep_fed: { votes: {}, branco: 0, nulo: 0, total: 0 },
      dep_est: { votes: {}, branco: 0, nulo: 0, total: 0 },
      senador: { votes: {}, branco: 0, nulo: 0, total: 0 },
      governador: { votes: {}, branco: 0, nulo: 0, total: 0 },
      presidente: { votes: {}, branco: 0, nulo: 0, total: 0 }
    };

    /* 브라질 공식 총선 순서 체인 */
    const SEQUENCE_ROLES = ['dep_fed', 'dep_est', 'senador', 'governador', 'presidente'];

    /* 현재 상태 */
    let currentRoleKey = 'dep_fed';
    let typedNumber = '';
    let isWhiteVote = false;
    let isFinished = false;
    let isInterTonePlaying = false;
    let currentPhotoRatio = '3:4'; // '3:4' or '4:5'
    let currentUploadedCandPhoto = '';
    let currentUploadedVicePhoto = '';

    /* Web Audio API 사운드 합성기 (인스타그램 및 TSE 실물과 일치) */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 일반 키패드 비프음
    function playKeyTone() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1420, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.055);
      } catch (e) {}
    }

    // 단계별(각 직책별) CONFIRMA 성공 시 울리는 중간 확인 비프음
    function playStepConfirmTone() {
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(940, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      } catch (e) {}
    }

    // 인스타그램 영상 및 실물 Urna Eletrônica 고유의 FIM 완료 사운드
    // (연속 5회의 스타카토 비프음 후 이어지는 깊고 맑은 TSE 시그니처 롱톤)
    function playFimTone() {
      initAudio();
      try {
        const now = audioCtx.currentTime;
        
        // 1. 앞선 5회 연속 비프음 ("삐-삐-삐-삐-삐")
        const beeps = [0, 0.075, 0.15, 0.225, 0.30];
        beeps.forEach(t => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1150, now + t);
          gain.gain.setValueAtTime(0.2, now + t);
          gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.045);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + t);
          osc.stop(now + t + 0.048);
        });

        // 2. 우르나 특유의 종결 롱톤 (약 1.3초 지속되는 브라질 선거 시그니처음)
        const longStartTime = now + 0.39;
        const oscLong = audioCtx.createOscillator();
        const oscLongSub = audioCtx.createOscillator();
        const gainLong = audioCtx.createGain();

        // 메인 톤
        oscLong.type = 'square';
        oscLong.frequency.setValueAtTime(840, longStartTime);
        
        // 배음
        oscLongSub.type = 'sine';
        oscLongSub.frequency.setValueAtTime(1680, longStartTime);

        gainLong.gain.setValueAtTime(0.25, longStartTime);
        gainLong.gain.setValueAtTime(0.25, longStartTime + 1.25);
        gainLong.gain.linearRampToValueAtTime(0.001, longStartTime + 1.45);

        oscLong.connect(gainLong);
        oscLongSub.connect(gainLong);
        gainLong.connect(audioCtx.destination);

        oscLong.start(longStartTime);
        oscLongSub.start(longStartTime);
        oscLong.stop(longStartTime + 1.46);
        oscLongSub.stop(longStartTime + 1.46);
      } catch (e) {}
    }

    // 알림 토스트 UI
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      const text = document.getElementById('toastMsg');
      text.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    // 화면 렌더링 함수
    function renderScreen() {
      const screen = document.getElementById('screenContent');
      const footerPrompt = document.getElementById('screenFooterPrompt');
      const tabsContainer = document.getElementById('topTabsContainer');
      const role = ROLES[currentRoleKey];

      // 상단 탭 렌더링 (사진과 일치하는 폴더 탭 스타일 + 클릭 시 즉시 해당 분야 이동)
      const roleKeys = SEQUENCE_ROLES;
      tabsContainer.innerHTML = roleKeys.map(k => {
        const isActive = (k === currentRoleKey);
        return `
          <button type="button" class="tab-btn px-2 py-0.5 text-[8px] sm:text-[9px] font-urna-screen tracking-tight transition cursor-pointer select-none border-b-2 ${isActive ? 'bg-[#18191c] text-white font-bold border-amber-400 shadow-sm' : 'bg-[#bfc3cb] hover:bg-[#a8adb7] text-[#33373e] font-medium border-transparent'}" data-role="${k}">
            ${ROLES[k].shortTab}
          </button>
        `;
      }).join('');

      // 상단 탭 클릭 이벤트 바인딩
      tabsContainer.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetRole = btn.getAttribute('data-role');
          switchRole(targetRole);
        });
      });

      // 1. 투표 완료 화면 (FIM / VOTOU)
      if (isFinished) {
        footerPrompt.style.display = 'none';
        screen.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center relative">
            <h1 class="scale-text-fim font-black tracking-normal text-stone-950 font-urna-screen leading-none">FIM</h1>
            <div class="absolute bottom-2 right-2 scale-text-sm font-semibold tracking-wider text-stone-700 uppercase font-urna-screen">
              VOTOU
            </div>
          </div>
        `;
        return;
      }

      footerPrompt.style.display = 'block';

      // 2. 백지 투표 (VOTO EM BRANCO)
      if (isWhiteVote) {
        screen.innerHTML = `
          <div class="flex-1 flex flex-col justify-between py-1.5 font-urna-screen">
            <div>
              <div class="scale-text-xs uppercase tracking-normal text-stone-700 font-normal">SEU VOTO PARA</div>
              <h2 class="scale-text-xl font-bold text-stone-900 tracking-tight leading-tight mt-0.5">${role.name}</h2>
            </div>
            
            <div class="py-5 text-center">
              <div class="scale-text-3xl font-black text-stone-950 tracking-wide text-blink">
                VOTO EM BRANCO
              </div>
            </div>

            <div class="text-center py-1">
              <span class="scale-text-base font-bold text-stone-900 text-blink">CONFIRA O SEU VOTO</span>
            </div>
          </div>
        `;
        return;
      }

      // 3. 후보자 번호/정보/사진 레이아웃
      const candidates = CANDIDATES_DB[currentRoleKey] || {};
      const candidate = candidates[typedNumber] || null;
      const isCompleteNumber = typedNumber.length === role.digits;
      const isNullVote = isCompleteNumber && !candidate;

      // 번호 박스
      let boxesHtml = '';
      for (let i = 0; i < role.digits; i++) {
        const char = typedNumber[i] || '';
        const isCurrent = (i === typedNumber.length);
        const activeClass = isCurrent ? 'border-[1.8px] border-stone-950 cursor-active' : 'border border-stone-500';
        boxesHtml += `
          <div class="w-6 h-8 sm:w-7 sm:h-9 bg-white/90 flex items-center justify-center scale-text-2xl font-bold text-stone-950 font-urna-screen ${activeClass}">
            ${char}
          </div>
        `;
      }

      // 사진 비율 클래스
      const aspectClass = (currentPhotoRatio === '4:5') ? 'aspect-[4/5] w-[84px] sm:w-[96px]' : 'aspect-[3/4] w-[80px] sm:w-[92px]';

      // 우측 상단 후보자 사진 영역
      let photoSectionHtml = '';
      if (candidate) {
        photoSectionHtml = `
          <div class="flex flex-col items-center">
            <div class="${aspectClass} bg-stone-200 border-[1.5px] border-stone-800 rounded-xs overflow-hidden shadow-xs relative">
              ${candidate.avatar ? `<img src="${candidate.avatar}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/120x150/dbe2d8/333333?text=Foto';" />` : `<div class="w-full h-full flex items-center justify-center text-3xl">👤</div>`}
            </div>

            ${role.hasVice && candidate.vice ? `

    function switchRole(roleKey) {
      if (!ROLES[roleKey]) return;
      currentRoleKey = roleKey;
      isFinished = false;
      typedNumber = '';
      isWhiteVote = false;

      // 우측 드롭다운 및 후보 입력란 동기화
      document.getElementById('roleSelector').value = roleKey;
      const role = ROLES[roleKey];
      const viceContainer = document.getElementById('viceContainer');
      viceContainer.style.display = role.hasVice ? 'flex' : 'none';

      const candNumInput = document.getElementById('newCandNumber');
      candNumInput.maxLength = role.digits;
      candNumInput.placeholder = `${role.digits}자리 번호`;

      renderCandidateList();
      renderScreen();
      showToast(`${role.shortTab} (${role.name}) 투표 단계로 전환되었습니다.`);
    }

    function handleDigit(numStr) {
      if (isFinished || isWhiteVote) return;
      const role = ROLES[currentRoleKey];
      if (typedNumber.length < role.digits) {
        typedNumber += numStr;
        playKeyTone();
        renderScreen();
      }
    }

    function handleWhite() {
      if (isFinished) return;
      if (typedNumber === '') {
        isWhiteVote = true;
        playKeyTone();
        renderScreen();
      }
    }

    function handleCorrige() {
      if (isFinished) return;
      playKeyTone();
      typedNumber = '';
      isWhiteVote = false;
      renderScreen();
    }

    function handleConfirma() {
      if (isFinished) {
        resetVoteScreen();
        return;
      }

      const role = ROLES[currentRoleKey];
      const isCompleteNumber = typedNumber.length === role.digits;

      if (isWhiteVote || isCompleteNumber) {
        // 투표 결과 카운팅
        const currentElection = ELECTION_RESULTS[currentRoleKey];
        currentElection.total++;

        if (isWhiteVote) {
          currentElection.branco++;
        } else {
          const cand = CANDIDATES_DB[currentRoleKey]?.[typedNumber];
          if (cand) {
            currentElection.votes[typedNumber] = (currentElection.votes[typedNumber] || 0) + 1;
          } else {
            currentElection.nulo++;
          }
        }

        const isSequential = document.getElementById('seqVoteToggle').checked;
        const currentIdx = SEQUENCE_ROLES.indexOf(currentRoleKey);
        const hasNext = isSequential && currentIdx < SEQUENCE_ROLES.length - 1;

        if (hasNext) {
          // 다음 선거 단계로 전환 (중간 비프음 재생 후 자동 이동)
          playStepConfirmTone();
          const nextRole = SEQUENCE_ROLES[currentIdx + 1];
          currentRoleKey = nextRole;
          typedNumber = '';
          isWhiteVote = false;

          document.getElementById('roleSelector').value = nextRole;
          const nextRoleObj = ROLES[nextRole];
          document.getElementById('viceContainer').style.display = nextRoleObj.hasVice ? 'flex' : 'none';
          document.getElementById('newCandNumber').maxLength = nextRoleObj.digits;
          document.getElementById('newCandNumber').placeholder = `${nextRoleObj.digits}자리 번호`;

          renderCandidateList();
          renderScreen();
          showToast(`다음 투표: ${nextRoleObj.shortTab} (${nextRoleObj.name})`);
        } else {
          // 최종 선거 종료: FIM 화면 및 TSE 시그니처 롱톤
          isFinished = true;
          renderScreen();
          playFimTone();

          // 3.5초 후 초기 1단계(연방하원의원)로 자동 리셋
          setTimeout(() => {
            currentRoleKey = SEQUENCE_ROLES[0];
            document.getElementById('roleSelector').value = currentRoleKey;
            resetVoteScreen();
          }, 3500);
        }
      } else {
        playKeyTone();
      }
    }

    function resetVoteScreen() {
      typedNumber = '';
      isWhiteVote = false;
      isFinished = false;
      renderScreen();
    }

    // 관리자 패널 후보자 목록 갱신
    function renderCandidateList() {
      const container = document.getElementById('candidatesListContainer');
      const countElem = document.getElementById('candidateCount');

        return `

      // 삭제 버튼 바인딩

    // 랜덤 미사용 유효 번호 생성
    document.getElementById('btnGenNumber').addEventListener('click', () => {
      const role = ROLES[currentRoleKey];
      const digits = role.digits;
      const min = Math.pow(10, digits - 1);
      const max = Math.pow(10, digits) - 1;
      let generated = '';
      let attempts = 0;
      do {
        generated = String(Math.floor(Math.random() * (max - min + 1)) + min);
        attempts++;
      } while (CANDIDATES_DB[currentRoleKey][generated] && attempts < 100);

      document.getElementById('newCandNumber').value = generated;
      showToast(`랜덤 번호 ${generated} 이(가) 생성되었습니다.`);
    });

    // 공통 이미지 파싱 및 프리뷰 처리 함수
    function applyCandidateImage(src, isVice = false) {
      if (isVice) {

    // 드래그 앤 드롭 및 웹 사진 링크/파일 처리 핸들러 설정
    function setupDropZone(dropZoneId, fileInputId, urlInputId, isVice = false) {
      const dropZone = document.getElementById(dropZoneId);
      const fileInput = document.getElementById(fileInputId);
      const urlInput = document.getElementById(urlInputId);

      // 드래그 진입/오버/이탈 시각 피드백
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('dropzone-active');
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('dropzone-active');
        });
      });

      // 드롭 이벤트 처리 (로컬 파일 및 웹에서 끌어온 이미지/URL 모두 지원)
      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        
        // 1. 로컬 이미지 파일 드롭인 경우
        if (dt.files && dt.files.length > 0) {
          const file = dt.files[0];
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => applyCandidateImage(event.target.result, isVice);
            reader.readAsDataURL(file);
            return;
          }
        }

        // 2. 웹페이지에서 이미지 자체나 URL 링크를 끌어다 놓은 경우
        const droppedText = dt.getData('text/uri-list') || dt.getData('text/plain') || dt.getData('text/html');
        if (droppedText) {
          let foundUrl = '';
          const urlMatch = droppedText.match(/https?:\/\/[^\s"'<>]+/i);
          if (urlMatch) {
            foundUrl = urlMatch[0];
          } else if (droppedText.startsWith('http')) {
            foundUrl = droppedText.trim();
          }

          if (foundUrl) {
            urlInput.value = foundUrl;
            applyCandidateImage(foundUrl, isVice);
            return;
          }
        }
      });

      // 파일 인풋 변경 시
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => applyCandidateImage(event.target.result, isVice);
          reader.readAsDataURL(file);
        }
      });

      // URL 직접 타이핑 또는 붙여넣기 시 즉시 프리뷰 반영
      urlInput.addEventListener('input', (e) => {
        const url = e.target.value.trim();
        if (url) {
          applyCandidateImage(url, isVice);
        }
      });
    }

        <div class="relative">
          <select id="roleSelector" class="w-full appearance-none bg-white border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-8 transition">
            <option value="dep_est">주하원의원 선거 (Deputado Estadual - 5자리)</option>
            <option value="dep_fed">연방하원의원 선거 (Deputado Federal - 4자리)</option>
            <option value="senador">상원의원 선거 (Senador - 3자리)</option>
            <option value="governador">주지사 선거 (Governador - 2자리)</option>
            <option value="presidente">대통령 선거 (Presidente - 2자리)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-500">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
          </div>
        </div>
      </div>
                <div class="w-full bg-slate-200 rounded-full h-1.5 mt-1 overflow-hidden">
                  <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${pct}%"></div>
                </div>
              </div>
            `;
          });

          // 백지표
          const brancoPct = ((res.branco / res.total) * 100).toFixed(1);
          html += `
            <div class="pt-1 border-t border-slate-200 mt-2">
              <div class="flex justify-between text-slate-600 font-medium">
                <span>VOTO EM BRANCO (백지표)</span>
                <span class="font-mono">${res.branco}표 (${brancoPct}%)</span>
              </div>
            </div>
          `;

          // 무효표
          const nuloPct = ((res.nulo / res.total) * 100).toFixed(1);
          html += `
            <div>
              <div class="flex justify-between text-rose-600 font-medium">
                <span>VOTO NULO (무효표)</span>
                <span class="font-mono">${res.nulo}표 (${nuloPct}%)</span>
              </div>
            </div>
          `;
        }

        html += `
            </div>
          </div>
        `;
      });

      content.innerHTML = html;
      document.getElementById('resultModal').classList.remove('hidden');
    });

    // 모달 닫기
    const closeModal = () => document.getElementById('resultModal').classList.add('hidden');
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnCloseModalBtn').addEventListener('click', closeModal);

    // 투표 결과 JSON 다운로드
    document.getElementById('btnExportResultJson').addEventListener('click', () => {
      const exportPackage = {
        app: "UrnaEletronica-UE2026",
        version: "2026.1",
        exportedAt: new Date().toISOString(),
        candidates: CANDIDATES_DB,
        results: ELECTION_RESULTS
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPackage, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `boletim_de_urna_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('후보 정보 및 개표 결과 JSON 파일이 저장되었습니다.');
    });

    // 하드웨어 버튼 클릭 이벤트 리스너 바인딩
    document.querySelectorAll('[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        handleDigit(btn.getAttribute('data-key'));
      });
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.getAttribute('data-action');
        if (action === 'BRANCO') handleWhite();
        else if (action === 'CORRIGE') handleCorrige();
        else if (action === 'CONFIRMA') handleConfirma();
      });
    });

    /* 키보드 입력 시 화면 키패드 물리적 눌림 애니메이션 표시 */
    function animateButtonPress(selector, isAction = false) {
      const btn = document.querySelector(selector);
      if (!btn) return;
      const activeClass = isAction ? 'key-pressed-action' : 'key-pressed';
      btn.classList.add(activeClass);
      setTimeout(() => {
        btn.classList.remove(activeClass);
      }, 110);
    }

    // 물리 키보드 바인딩 (컴퓨터 상단 숫자열 및 우측 넘버패드 완벽 지원)
    window.addEventListener('keydown', (e) => {
      // 폼 입력(input, select, textarea) 중일 때는 우르나 키 조작 방지
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      // 1. 숫자키 (상단 숫자키 '0'~'9' 및 우측 넘버패드 Numpad 0~9 지원)
      if ((e.key >= '0' && e.key <= '9') || (e.code && e.code.startsWith('Numpad') && !isNaN(e.key))) {
        e.preventDefault();
        const digit = e.key;
        animateButtonPress(`[data-key="${digit}"]`);
        handleDigit(digit);
        return;
      }

      // 2. 확인 키: Enter 및 넘버패드 Enter
      if (e.key === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        animateButtonPress('[data-action="CONFIRMA"]', true);
        handleConfirma();
        return;
      }

      // 3. 정정 키: Backspace, Delete, Escape, 'C', 'c'
      if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        animateButtonPress('[data-action="CORRIGE"]', true);
        handleCorrige();
        return;
      }

      // 4. 백지 투표 키: 'B', 'b', Space (스페이스바)
      if (e.key === 'b' || e.key === 'B' || e.code === 'Space') {
        e.preventDefault();
        animateButtonPress('[data-action="BRANCO"]', true);
        handleWhite();
        return;
      }
    });

    // 초기 렌더링
    renderCandidateList();
    renderScreen();
  </script>
</body>
</html>
